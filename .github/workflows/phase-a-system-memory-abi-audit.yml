name: Phase A SystemMemoryGB ABI Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-system-memory-abi-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-system-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover SystemMemoryGB
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          audit/tools/goresym -d "${BIN}" > audit/functions.json
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          binary=Path('audit/output/binary-path.txt').read_text().strip()
          data=json.loads(Path('audit/functions.json').read_text())
          funcs=list(data.get('UserFunctions') or [])+list(data.get('StdFunctions') or [])
          def n(v): return int(v,0) if isinstance(v,str) else int(v or 0)
          rows=[]; by={}
          for f in funcs:
              name=f.get('FullName') or ''
              s,e=n(f.get('Start')),n(f.get('End'))
              if s and e>s:
                  rows.append((s,e,name,f)); by[s]=name
          rows.sort()
          target=None
          for s,e,name,f in rows:
              if name.endswith('internal/utils/mem.SystemMemoryGB'):
                  target=(s,e,name,f); break
          if target is None:
              raise SystemExit('missing SystemMemoryGB')
          s,e,name,f=target
          Path('audit/output/target.txt').write_text(f'0x{s:x}\t0x{e:x}\t{name}\n')
          asm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary],text=True,errors='replace')
          Path('audit/output/SystemMemoryGB.asm.txt').write_text(asm)
          call_re=re.compile(r'\bcall\s+(?:0x)?([0-9a-f]+)',re.I)
          calls=[]
          for line in asm.splitlines():
              m=call_re.search(line)
              if m:
                  a=int(m.group(1),16); calls.append(f'0x{a:x}\t{by.get(a,"<unknown>")}\t{line.strip()}\n')
          Path('audit/output/SystemMemoryGB.calls.txt').write_text(''.join(calls))

          # 把被调的项目/依赖函数再展开一层，确认数据源和错误分支。
          second=[]
          for row in calls:
              a=int(row.split('\t',1)[0],16)
              callee=next(((ss,ee,nn) for ss,ee,nn,ff in rows if ss==a),None)
              if callee is None: continue
              ss,ee,nn=callee
              if ee-ss > 0x4000: continue
              aasm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{ss:x}',f'--stop-address=0x{ee:x}',binary],text=True,errors='replace')
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',nn)[-150:]
              Path(f'audit/output/callee-{safe}.asm.txt').write_text(aasm)
              second.append(f'0x{ss:x}\t0x{ee:x}\t{nn}\n')
          Path('audit/output/callees.txt').write_text(''.join(second))
          PY

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# GoEdge 1.3.9 Plus SystemMemoryGB 静态审计'
            echo
            echo '- 可信 ZIP / edge-node MD5：PASS'
            echo '- 原版 edge-node 未执行。'
            echo
            cat audit/output/target.txt
            echo
            echo '## 直接调用'
            cat audit/output/SystemMemoryGB.calls.txt
            echo
            echo '## 汇编'
            cat audit/output/SystemMemoryGB.asm.txt
          } > audit/output/summary.md
          cat audit/output/summary.md

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-system-memory-abi-audit
          path: audit/output/
          if-no-files-found: warn
          retention-days: 7
