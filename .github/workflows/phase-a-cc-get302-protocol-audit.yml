name: Phase A CC GET302 Protocol Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-cc-get302-protocol-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-get302:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4

      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover doCC GET302 control flow
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          audit/tools/goresym -d "${BIN}" > audit/functions.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('audit/functions.json').read_text())
          funcs = list(data.get('UserFunctions') or []) + list(data.get('StdFunctions') or [])
          def n(v):
              return int(v, 0) if isinstance(v, str) else int(v or 0)

          targets = {}
          by_start = {}
          for fn in funcs:
              name = fn.get('FullName') or ''
              start, end = n(fn.get('Start', 0)), n(fn.get('End', 0))
              if start:
                  by_start[start] = name
              if name.endswith('(*HTTPRequest).doCC'):
                  targets['doCC'] = (start, end, name)
              elif name.endswith('(*HTTPRequest).checkCCRedirects'):
                  targets['checkCCRedirects'] = (start, end, name)

          for required in ('doCC', 'checkCCRedirects'):
              if required not in targets:
                  raise SystemExit(f'未找到 {required}')
              s, e, name = targets[required]
              Path(f'audit/output/{required}-range.txt').write_text(f'0x{s:x}\t0x{e:x}\t{name}\n')

          Path('audit/by-start.json').write_text(json.dumps({str(k): v for k, v in by_start.items()}))
          PY

          read -r DO_START DO_END DO_NAME < audit/output/doCC-range.txt
          objdump -d -M intel --start-address="${DO_START}" --stop-address="${DO_END}" "${BIN}" > audit/output/doCC-objdump.txt

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          by_start = {int(k): v for k, v in json.loads(Path('audit/by-start.json').read_text()).items()}
          asm_lines = Path('audit/output/doCC-objdump.txt').read_text(errors='replace').splitlines()

          calls = []
          check_addr = None
          for addr, name in by_start.items():
              if name.endswith('(*HTTPRequest).checkCCRedirects'):
                  check_addr = addr
                  break
          if check_addr is None:
              raise SystemExit('没有 checkCCRedirects 地址')

          hit_line = None
          for i, line in enumerate(asm_lines):
              m = re.search(r'\bcall\s+(?:0x)?([0-9a-f]+)', line, re.I)
              if not m:
                  continue
              addr = int(m.group(1), 16)
              name = by_start.get(addr, '<unknown>')
              calls.append(f'0x{addr:x}\t{name}\t{line.strip()}\n')
              if addr == check_addr:
                  hit_line = i

          Path('audit/output/doCC-calls.txt').write_text(''.join(calls))
          if hit_line is None:
              raise SystemExit('doCC 中没有找到 checkCCRedirects 调用')

          start = max(0, hit_line - 150)
          end = min(len(asm_lines), hit_line + 180)
          context = '\n'.join(asm_lines[start:end]) + '\n'
          Path('audit/output/doCC-checkCCRedirects-context.txt').write_text(context)

          refs = []
          for line in asm_lines[start:end]:
              refs.extend(int(x, 16) for x in re.findall(r'#\s+0x([0-9a-f]+)', line, re.I))
          Path('audit/output/get302-context-addresses.txt').write_text(
              ''.join(f'0x{x:x}\n' for x in sorted(set(refs)))
          )
          PY

      - name: Dump GET302 referenced constants from ELF
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          readelf -W -l "${BIN}" > audit/program-headers.txt

          python3 - <<'PY'
          import re
          from pathlib import Path

          binary = Path(Path('audit/output/binary-path.txt').read_text().strip()).read_bytes()
          ph = Path('audit/program-headers.txt').read_text(errors='replace').splitlines()
          segments = []
          for line in ph:
              parts = line.split()
              if not parts or parts[0] != 'LOAD' or len(parts) < 6:
                  continue
              off = int(parts[1], 16)
              va = int(parts[2], 16)
              filesz = int(parts[4], 16)
              segments.append((va, va + filesz, off))

          addrs = []
          for line in Path('audit/output/get302-context-addresses.txt').read_text().splitlines():
              if line.strip():
                  addrs.append(int(line, 16))

          out = []
          for addr in addrs:
              file_off = None
              for va0, va1, off0 in segments:
                  if va0 <= addr < va1:
                      file_off = off0 + (addr - va0)
                      break
              if file_off is None:
                  continue
              raw = binary[file_off:file_off+128]
              printable = ''.join(chr(b) if 32 <= b < 127 else '.' for b in raw)
              utf = raw.decode('utf-8', errors='replace').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t')
              out.append(f'ADDR 0x{addr:x} FILE+0x{file_off:x}\nHEX {raw.hex()}\nASCII {printable}\nUTF8 {utf}\n\n')
          Path('audit/output/get302-context-rodata.txt').write_text(''.join(out))
          PY

      - name: Disassemble checkCCRedirects with mapped calls
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          read -r START END NAME < audit/output/checkCCRedirects-range.txt
          objdump -d -M intel --start-address="${START}" --stop-address="${END}" "${BIN}" > audit/output/checkCCRedirects-objdump.txt

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          by_start = {int(k): v for k, v in json.loads(Path('audit/by-start.json').read_text()).items()}
          asm = Path('audit/output/checkCCRedirects-objdump.txt').read_text(errors='replace')
          out = []
          for line in asm.splitlines():
              m = re.search(r'\bcall\s+(?:0x)?([0-9a-f]+)', line, re.I)
              if not m:
                  continue
              addr = int(m.group(1), 16)
              out.append(f'0x{addr:x}\t{by_start.get(addr, "<unknown>")}\t{line.strip()}\n')
          Path('audit/output/checkCCRedirects-calls-mapped.txt').write_text(''.join(out))
          PY

      - name: Build protocol audit summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# GoEdge 1.3.9 Plus CC GET302 协议静态审计'
            echo
            echo '- ZIP MD5: d6b495249683d981dea15b5bad97acdb (PASS)'
            echo '- edge-node MD5: 8ebac47c212dbb41cc0b2b9c6d4b32e4 (PASS)'
            echo '- 原版 edge-node 未执行。'
            echo
            echo '## doCC 直接调用'
            cat audit/output/doCC-calls.txt
            echo
            echo '## checkCCRedirects 直接调用'
            cat audit/output/checkCCRedirects-calls-mapped.txt
          } > audit/output/summary.md

      - name: Upload GET302 protocol audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-cc-get302-protocol-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
