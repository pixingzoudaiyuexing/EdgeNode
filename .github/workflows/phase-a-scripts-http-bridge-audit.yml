name: Phase A Scripts HTTP Bridge Audit

on:
  push:
    branches:
      - phase-a-scripts-http-bridge
    paths:
      - ".github/workflows/phase-a-scripts-http-bridge-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-http-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover exact HTTP bridge interfaces and prototypes
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"

          # 这两个地址来自已通过的 Scripts ABI artifact：所有 Request / Response 业务方法的 assertE2I 目标。
          audit/tools/goresym -d -m 0x2fba820 -human "${BIN}" > audit/output/request-interface.txt
          audit/tools/goresym -d -m 0x2dd5bc0 -human "${BIN}" > audit/output/response-interface.txt

          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          path=Path('audit/output/binary-path.txt').read_text().strip()
          data=Path(path).read_bytes()
          targets={
              'request': b'gojs.net.http.Request = class {',
              'response': b'gojs.net.http.Response = class {',
          }

          def extract_class(prefix):
              start=data.find(prefix)
              if start < 0:
                  raise SystemExit('prototype prefix missing: '+prefix.decode())
              # 直接按字节匹配 JS class 花括号；只处理普通单双引号、注释和转义。
              brace=data.find(b'{',start)
              depth=0; quote=None; escape=False; line_comment=False; block_comment=False
              i=brace
              while i < min(len(data), start+16384):
                  c=data[i]; n=data[i+1] if i+1 < len(data) else 0
                  if line_comment:
                      if c==10: line_comment=False
                      i+=1; continue
                  if block_comment:
                      if c==42 and n==47: block_comment=False; i+=2; continue
                      i+=1; continue
                  if quote is not None:
                      if escape: escape=False
                      elif c==92: escape=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c in (34,39,96): quote=c; i+=1; continue
                  if c==47 and n==47: line_comment=True; i+=2; continue
                  if c==47 and n==42: block_comment=True; i+=2; continue
                  if c==123: depth+=1
                  elif c==125:
                      depth-=1
                      if depth==0:
                          raw=data[start:i+1]
                          return start,raw
                  i+=1
              raise SystemExit('prototype closing brace not found')

          summary=[]
          for name,prefix in targets.items():
              off,raw=extract_class(prefix)
              text=raw.decode('utf-8')
              Path(f'audit/output/{name}-prototype.js.txt').write_text(text+'\n')
              summary.append(f'{name}\toffset=0x{off:x}\tlen={len(raw)}\tsha256={hashlib.sha256(raw).hexdigest()}\n')
          Path('audit/output/prototype-summary.txt').write_text(''.join(summary))
          print(''.join(summary),end='')
          PY

          grep -F 'gojs.net.http.Request = class {' audit/output/request-prototype.js.txt
          grep -F 'gojs.net.http.Response = class {' audit/output/response-prototype.js.txt

      - name: Upload HTTP bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-http-bridge-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
