name: Phase A Scripts Self Test Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-scripts-selftest-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-js-pool-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Extract exact self-test strings
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          python3 - <<'PY'
          import struct
          from pathlib import Path

          path=Path('audit/output/binary-path.txt').read_text().strip()
          data=Path(path).read_bytes()
          if data[:4] != b'\x7fELF' or data[4] != 2 or data[5] != 1:
              raise SystemExit('unexpected ELF')
          e_phoff=struct.unpack_from('<Q',data,32)[0]
          e_phentsize=struct.unpack_from('<H',data,54)[0]
          e_phnum=struct.unpack_from('<H',data,56)[0]
          loads=[]
          for i in range(e_phnum):
              o=e_phoff+i*e_phentsize
              typ,flags=struct.unpack_from('<II',data,o)
              if typ != 1: continue
              po,pv,pp,pfs,pms,pa=struct.unpack_from('<QQQQQQ',data,o+8)
              loads.append((pv,pv+pfs,po))
          def read_va(addr,n):
              for lo,hi,off in loads:
                  if lo <= addr and addr+n <= hi:
                      p=off+(addr-lo)
                      return data[p:p+n]
              raise SystemExit(f'address 0x{addr:x} not file-backed')

          source=read_va(0x30b081f,14)
          origin=read_va(0x309c9d4,8)
          Path('audit/output/selftest-source.bin.txt').write_text(source.hex()+'\n')
          Path('audit/output/selftest-origin.bin.txt').write_text(origin.hex()+'\n')
          Path('audit/output/selftest-source.txt').write_text(source.decode('utf-8')+'\n')
          Path('audit/output/selftest-origin.txt').write_text(origin.decode('utf-8')+'\n')
          print('source:',repr(source.decode('utf-8')))
          print('origin:',repr(origin.decode('utf-8')))
          PY

      - name: Upload self-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-selftest-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
