name: Phase A Scripts Pool Semantics Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-scripts-pool-semantics-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-js-pool-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4

      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover pool semantics
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          audit/tools/goresym -d "${BIN}" > audit/functions.json

          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          binary=Path('audit/output/binary-path.txt').read_text().strip()
          data=json.loads(Path('audit/functions.json').read_text())
          funcs=list(data.get('UserFunctions') or [])+list(data.get('StdFunctions') or [])
          def n(v): return int(v,0) if isinstance(v,str) else int(v or 0)
          rows=[]
          for f in funcs:
              name=f.get('FullName') or ''
              s,e=n(f.get('Start')),n(f.get('End'))
              if s and e>s: rows.append((s,e,name,f))
          rows.sort()

          # 只关注 internal/js 池实现附近，包含编译器生成闭包。
          nearby=[]
          for s,e,name,f in rows:
              if 0x1706e00 <= s < 0x1707c80 or 'EdgeNode/internal/js.(*IsolatePool)' in name or 'EdgeNode/internal/js.NewAutoIsolatePool' in name or 'EdgeNode/internal/js.NewIsolatePool' in name:
                  nearby.append((s,e,name,f))
          Path('audit/output/nearby-functions.txt').write_text(''.join(f'0x{s:x}\t0x{e:x}\t{name}\n' for s,e,name,f in nearby))

          call_re=re.compile(r'\bcall\s+(?:0x)?([0-9a-f]+)',re.I)
          by={s:name for s,e,name,f in rows}
          for s,e,name,f in nearby:
              asm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary],text=True,errors='replace')
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',name)[-160:]
              Path(f'audit/output/{safe}.asm.txt').write_text(asm)
              calls=[]
              for line in asm.splitlines():
                  m=call_re.search(line)
                  if m:
                      a=int(m.group(1),16)
                      calls.append(f'0x{a:x}\t{by.get(a,"<unknown>")}\t{line.strip()}\n')
              Path(f'audit/output/{safe}.calls.txt').write_text(''.join(calls))

          # 固定整个池代码区域，方便检查内联 OverUses、轮转下标、dirty isolate 清理。
          region=subprocess.check_output([
              'objdump','-d','-M','intel','--start-address=0x1706ea0','--stop-address=0x1707b60',binary
          ],text=True,errors='replace')
          Path('audit/output/pool-region.asm.txt').write_text(region)

          # 静态提取已确认常量，并让未来可信二进制变化时 CI 直接报警。
          checks={
              'auto_memory_times_2': r'1707533:.*shl\s+rax,1',
              'auto_min_2': r'1707539:.*mov\s+ecx,0x2',
              'auto_max_256': r'1707542:.*cmp\s+rax,0x100',
              'manual_min_1': r'17073d5:.*mov\s+edx,0x1',
              'manual_max_512': r'17073de:.*cmp\s+rax,0x200',
              'contexts_per_pool_isolate_8': r'17075b2:.*mov\s+eax,0x8',
              'overuses_threshold_4096': r'1707043:.*cmp\s+ecx,0x1000',
              'ticker_5_seconds': r'17076a5:.*movabs\s+rax,0x12a05f200',
          }
          result=[]
          for key,pat in checks.items():
              ok=bool(re.search(pat,region,re.M))
              result.append(f'{key}={"PASS" if ok else "FAIL"}\n')
              if not ok: raise SystemExit('常量审计失败: '+key)
          Path('audit/output/constant-checks.txt').write_text(''.join(result))

          # 恢复 init 里被调用的闭包地址 0x17077a0 所属函数。
          closure=[]
          for s,e,name,f in rows:
              if s <= 0x17077a0 < e or s == 0x17077a0:
                  closure.append((s,e,name,f))
          Path('audit/output/ticker-closure.txt').write_text(''.join(f'0x{s:x}\t0x{e:x}\t{name}\n' for s,e,name,f in closure))
          if closure:
              s,e,name,_=closure[0]
              asm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary],text=True,errors='replace')
              Path('audit/output/ticker-closure.asm.txt').write_text(asm)

          # 0x62215ee 是 init 中条件创建第二个 5 秒 ticker 的全局开关；只找静态交叉引用，不猜名称。
          dis=subprocess.check_output(['objdump','-d','-M','intel',binary],text=True,errors='replace')
          lines=dis.splitlines()
          xrefs=[]
          for i,line in enumerate(lines):
              if '62215ee' in line.lower():
                  xrefs.extend(lines[max(0,i-4):min(len(lines),i+5)])
                  xrefs.append('---')
          Path('audit/output/ticker-toggle-xrefs.txt').write_text('\n'.join(xrefs)+'\n')

          # 记录源路径，验证闭包仍来自原版脚本池文件。
          paths=[]
          for s,e,name,f in nearby+closure:
              blob=json.dumps(f,ensure_ascii=False)
              srcs=sorted(set(re.findall(r'[^"\\\s]+\.go',blob)))
              if srcs:
                  paths.append(name+'\n'+''.join('  source: '+p+'\n' for p in srcs))
          Path('audit/output/source-paths.txt').write_text(''.join(paths))
          PY

      - name: Build pool semantics summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# GoEdge 1.3.9 Plus internal/js 池回收语义审计'
            echo
            echo '- ZIP / edge-node MD5 校验通过。'
            echo '- 仅执行 GoReSym / objdump 静态分析；原版 edge-node 未执行。'
            echo
            echo '## 固定常量'
            cat audit/output/constant-checks.txt
            echo
            echo '## 池实现附近函数'
            cat audit/output/nearby-functions.txt
            echo
            echo '## ticker 闭包'
            cat audit/output/ticker-closure.txt
            test -f audit/output/ticker-closure.asm.txt && cat audit/output/ticker-closure.asm.txt || true
            echo
            echo '## ticker 条件开关交叉引用'
            sed -n '1,260p' audit/output/ticker-toggle-xrefs.txt
            echo
            echo '## 源路径'
            sed -n '1,320p' audit/output/source-paths.txt
          } > audit/output/summary.md
          cat audit/output/summary.md

      - name: Upload pool semantics audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-pool-semantics-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
