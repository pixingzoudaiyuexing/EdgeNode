name: Phase A CC Verify

on:
  push:
    branches:
      - master
    paths:
      - "internal/cc/**"
      - "internal/nodes/http_request_cc*.go"
      - ".github/workflows/phase-a-cc-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4
        with:
          path: EdgeNode

      - name: Checkout EdgeCommon
        uses: actions/checkout@v4
        with:
          repository: pixingzoudaiyuexing/EdgeCommon
          ref: main
          path: EdgeCommon

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: EdgeNode/go.sum

      - name: CC unit tests
        working-directory: EdgeNode
        run: go test ./internal/cc

      - name: Prepare CI-only shims for unrelated Plus gaps
        working-directory: EdgeNode
        run: |
          # 这些 shim 只存在于 Actions 工作目录，用于隔离与高级 CC 无关的历史 Plus 缺口。
          # 高级 CC 本身必须使用仓库中的正式 http_request_cc_plus.go，不能用空桩代替。
          sed 's#//go:build !plus#//go:build plus#' \
            internal/utils/minifiers/minify.go \
            > internal/utils/minifiers/minify_ci_plus.go

          for source in \
            http_request_ln.go \
            http_request_plan_before.go \
            http_request_hls.go \
            http_request_oss.go \
            http_writer_ext.go \
            listener_base_ext.go \
            node_tasks_ext.go \
            toa_manager.go
          do
            target="internal/nodes/${source%.go}_ci_plus.go"
            sed 's#//go:build !plus#//go:build plus#; s#// +build !plus#// +build plus#' \
              "internal/nodes/${source}" > "${target}"
          done

          sed 's#//go:build !plus#//go:build plus#; s#// +build !plus#// +build plus#' \
            ../EdgeCommon/pkg/serverconfigs/ossconfigs/oss_config.go \
            > ../EdgeCommon/pkg/serverconfigs/ossconfigs/oss_config_ci_plus.go

          sed 's#//go:build !plus#//go:build plus#' \
            ../EdgeCommon/pkg/serverconfigs/http_auth_policy_init.go \
            > ../EdgeCommon/pkg/serverconfigs/http_auth_policy_init_ci_plus.go

          cat > ../EdgeCommon/pkg/serverconfigs/http_auth_type_ci_plus.go <<'EOF'
          //go:build plus

          package serverconfigs

          type HTTPAuthType = string

          const (
              HTTPAuthTypeBasicAuth  HTTPAuthType = "basicAuth"
              HTTPAuthTypeSubRequest HTTPAuthType = "subRequest"
          )
          EOF

          cat > ../EdgeCommon/pkg/nodeconfigs/toa_config_ci_plus.go <<'EOF'
          //go:build plus

          package nodeconfigs

          type TOAConfig struct {
              IsOn bool `yaml:"isOn" json:"isOn"`
          }

          func NewTOAConfig() *TOAConfig { return &TOAConfig{} }
          func (this *TOAConfig) Init() error { return nil }
          func (this *TOAConfig) RandLocalPort() uint16 { return 0 }
          EOF

          gofmt -w \
            internal/utils/minifiers/minify_ci_plus.go \
            internal/nodes/http_request_ln_ci_plus.go \
            internal/nodes/http_request_plan_before_ci_plus.go \
            internal/nodes/http_request_hls_ci_plus.go \
            internal/nodes/http_request_oss_ci_plus.go \
            internal/nodes/http_writer_ext_ci_plus.go \
            internal/nodes/listener_base_ext_ci_plus.go \
            internal/nodes/node_tasks_ext_ci_plus.go \
            internal/nodes/toa_manager_ci_plus.go \
            ../EdgeCommon/pkg/serverconfigs/ossconfigs/oss_config_ci_plus.go \
            ../EdgeCommon/pkg/serverconfigs/http_auth_policy_init_ci_plus.go \
            ../EdgeCommon/pkg/serverconfigs/http_auth_type_ci_plus.go \
            ../EdgeCommon/pkg/nodeconfigs/toa_config_ci_plus.go

      - name: Plus CC request tests
        working-directory: EdgeNode
        run: go test -tags plus ./internal/nodes -run '^TestHTTPRequestDoCC'

      - name: Type-check Plus CC request chain
        working-directory: EdgeNode
        shell: bash
        run: |
          set +e
          go test -run '^$' -tags plus ./internal/nodes 2>&1 | tee cc-plus-typecheck.log
          status=${PIPESTATUS[0]}
          echo "${status}" > cc-plus-typecheck.status
          exit "${status}"

      - name: Upload Plus CC type-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-plus-typecheck-log
          path: |
            EdgeNode/cc-plus-typecheck.log
            EdgeNode/cc-plus-typecheck.status
          if-no-files-found: error
