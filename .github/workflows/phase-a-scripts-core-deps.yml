name: Phase A Scripts Core Dependency Lock

on:
  push:
    branches:
      - phase-a-scripts-core
    paths:
      - ".github/workflows/phase-a-scripts-core-deps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-v8go:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout scripts core branch
        uses: actions/checkout@v4

      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: false

      - name: Generate exact v8go 0.8.0 checksums
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.before
          go mod edit -require=rogchap.com/v8go@v0.8.0
          go mod download rogchap.com/v8go@v0.8.0
          grep -F 'rogchap.com/v8go v0.8.0' go.sum | tee /tmp/v8go-go.sum
          cp go.mod /tmp/v8go-go.mod
          test "$(wc -l < /tmp/v8go-go.sum)" -eq 2

      - name: Upload dependency lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: scripts-core-v8go-lock
          path: |
            /tmp/v8go-go.mod
            /tmp/v8go-go.sum
          if-no-files-found: error
          retention-days: 7
