name: Phase A Scripts Context Library Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-scripts-context-library-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-context-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4

      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover Context and Library ABI
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          audit/tools/goresym -d "${BIN}" > audit/functions.json

          python3 - <<'PY'
          import json,re,struct,subprocess
          from pathlib import Path

          binary_path=Path('audit/output/binary-path.txt').read_text().strip()
          binary=Path(binary_path).read_bytes()
          data=json.loads(Path('audit/functions.json').read_text())
          funcs=list(data.get('UserFunctions') or [])+list(data.get('StdFunctions') or [])
          def n(v): return int(v,0) if isinstance(v,str) else int(v or 0)
          rows=[]; by={}
          for f in funcs:
              name=f.get('FullName') or ''
              s,e=n(f.get('Start')),n(f.get('End'))
              if s and e>s:
                  rows.append((s,e,name,f)); by[s]=name
          rows.sort()

          wanted=(
              'internal/js.NewContext',
              'internal/js.(*Context).init',
              'internal/js.(*Context).AddGoObject',
              'internal/js.(*Context).AddGoRequestObject',
              'internal/js.(*Context).AddGoResponseObject',
              'internal/js.(*Context).GoObject',
              'internal/js.(*Context).GoObjectMap',
              'internal/js.(*Context).Done',
              'internal/js.(*Context).Cleanup',
              'internal/js.(*Context).Close',
              'internal/js.(*Context).loadLibraries',
              'internal/js.(*LibraryManager).Register',
              'internal/js.(*LibraryManager).All',
              'internal/js.(*JSBaseLibrary).JSInit',
              'internal/js.(*JSBaseLibrary).JSDone',
              'internal/js.(*JSBaseLibrary).JSDispose',
              'internal/js.(*JSNetHTTPClientLibrary).JSDone',
          )
          targets=[]
          for s,e,name,f in rows:
              if any(name.endswith(x) for x in wanted): targets.append((s,e,name,f))
          Path('audit/output/targets.txt').write_text(''.join(f'0x{s:x}\t0x{e:x}\t{name}\n' for s,e,name,f in targets))

          call_re=re.compile(r'\bcall\s+(?:0x)?([0-9a-f]+)',re.I)
          for s,e,name,f in targets:
              asm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary_path],text=True,errors='replace')
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',name)[-170:]
              Path(f'audit/output/{safe}.asm.txt').write_text(asm)
              calls=[]
              for line in asm.splitlines():
                  m=call_re.search(line)
                  if m:
                      a=int(m.group(1),16)
                      calls.append(f'0x{a:x}\t{by.get(a,"<unknown>")}\t{line.strip()}\n')
              Path(f'audit/output/{safe}.calls.txt').write_text(''.join(calls))

          # ELF64 PT_LOAD 虚拟地址 -> 文件偏移映射，用于直接读取 Go itab。
          if binary[:4] != b'\x7fELF' or binary[4] != 2 or binary[5] != 1:
              raise SystemExit('unexpected ELF format')
          e_phoff=struct.unpack_from('<Q',binary,32)[0]
          e_phentsize=struct.unpack_from('<H',binary,54)[0]
          e_phnum=struct.unpack_from('<H',binary,56)[0]
          loads=[]
          for i in range(e_phnum):
              off=e_phoff+i*e_phentsize
              p_type,p_flags=struct.unpack_from('<II',binary,off)
              if p_type != 1: continue
              p_offset,p_vaddr,p_paddr,p_filesz,p_memsz,p_align=struct.unpack_from('<QQQQQQ',binary,off+8)
              loads.append((p_vaddr,p_vaddr+p_filesz,p_offset))
          def read_va(addr,size):
              for lo,hi,fo in loads:
                  if lo <= addr and addr+size <= hi:
                      o=fo+(addr-lo)
                      return binary[o:o+size]
              raise ValueError(f'VA 0x{addr:x} not in file-backed LOAD')

          # 原版十个 init.N 注册点的 itab 地址；每个相邻 0x40，正好容纳 5 个接口方法。
          itabs=[
              ('init.0',0x35b29c0),('init.1',0x35b2980),('init.2',0x35b2940),('init.3',0x35b2900),('init.4',0x35b28c0),
              ('init.5',0x35b2880),('init.6',0x35b2840),('init.7',0x35b2800),('init.8',0x35b27c0),('init.9',0x35b2780),
          ]
          out=[]
          for label,addr in itabs:
              raw=read_va(addr,0x40)
              inter,typeptr=struct.unpack_from('<QQ',raw,0)
              h=struct.unpack_from('<I',raw,16)[0]
              fun=struct.unpack_from('<QQQQQ',raw,24)
              names=[by.get(x,'<unknown>') for x in fun]
              out.append(f'{label}\titab=0x{addr:x}\tinter=0x{inter:x}\ttype=0x{typeptr:x}\thash=0x{h:x}\n')
              for i,(a,name) in enumerate(zip(fun,names)):
                  out.append(f'  fun[{i}]\t0x{a:x}\t{name}\n')
          Path('audit/output/library-itabs.txt').write_text(''.join(out))

          # 固定 Context Go Object ID 协议与 LibraryManager 布局，不允许可信二进制变化后静默漂移。
          checks=[]
          def asm_for(suffix):
              for s,e,name,f in targets:
                  if name.endswith(suffix):
                      return subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary_path],text=True,errors='replace')
              raise SystemExit('missing target '+suffix)
          add=asm_for('internal/js.(*Context).AddGoObject')
          done=asm_for('internal/js.(*Context).Done')
          close=asm_for('internal/js.(*Context).Close')
          reg=asm_for('internal/js.(*LibraryManager).Register')
          allasm=asm_for('internal/js.(*LibraryManager).All')
          httpdone=asm_for('internal/js.(*JSNetHTTPClientLibrary).JSDone')
          assertions={
              'go_object_id_increment_offset_0x18': bool(re.search(r'\[r\w+\+0x18\].*|\[rcx\+0x18\]',add)),
              'go_object_id_reset_offset_0x18': bool(re.search(r'\+0x18\],0x0',done)),
              'done_counter_increment_offset_0x48': bool(re.search(r'inc\s+QWORD PTR \[rax\+0x48\]',done)),
              'library_manager_mutex_offset_0x18_register': bool(re.search(r'\+0x18\]',reg)),
              'library_manager_mutex_offset_0x18_all': bool(re.search(r'\+0x18\]',allasm)),
              'http_client_jsdone_reads_go_object_map': '1702ac0' in httpdone,
              'base_jsinit_noop': len([x for x in asm_for('internal/js.(*JSBaseLibrary).JSInit').splitlines() if '\t' in x and re.search(r'\b(call|jmp)\b',x)]) == 0,
              'base_jsdone_noop': len([x for x in asm_for('internal/js.(*JSBaseLibrary).JSDone').splitlines() if '\t' in x and re.search(r'\b(call|jmp)\b',x)]) == 0,
              'base_jsdispose_noop': len([x for x in asm_for('internal/js.(*JSBaseLibrary).JSDispose').splitlines() if '\t' in x and re.search(r'\b(call|jmp)\b',x)]) == 0,
          }
          for k,v in assertions.items():
              checks.append(f'{k}={"PASS" if v else "FAIL"}\n')
              if not v: raise SystemExit('ABI assertion failed: '+k)
          Path('audit/output/assertions.txt').write_text(''.join(checks))

          # 找 Context +0x48 在 internal/js Context 方法族中的直接引用；若除了 Done 外新增读取，需要重新解释字段语义。
          context48=[]
          for s,e,name,f in rows:
              if 'EdgeNode/internal/js.(*Context).' not in name: continue
              asm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary_path],text=True,errors='replace')
              for line in asm.splitlines():
                  if re.search(r'\[[a-z0-9]+\+0x48\]',line,re.I): context48.append(name+'\t'+line.strip()+'\n')
          Path('audit/output/context-offset-48-refs.txt').write_text(''.join(context48))

          # 输出十个 init.N 注册现场，和 itab 结果交叉验证真实注册顺序。
          init_rows=[]
          for s,e,name,f in rows:
              if re.search(r'EdgeNode/internal/js\.init\.[0-9]+$',name):
                  asm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary_path],text=True,errors='replace')
                  init_rows.append(f'## {name} 0x{s:x}-0x{e:x}\n{asm}\n')
          Path('audit/output/library-init-sites.txt').write_text(''.join(init_rows))

          # 相关只读字符串：保留 namespace/prototype/bootstrap 证据，不提取整个二进制字符串表。
          strings=subprocess.check_output(['strings','-a','-t','x',binary_path],text=True,errors='replace')
          hits=[]
          patterns=('gojs.','prepare namespace','load library failed','prototype failed','must be started with prefix')
          for line in strings.splitlines():
              if any(p in line for p in patterns): hits.append(line)
          Path('audit/output/library-strings.txt').write_text('\n'.join(hits[:500])+'\n')
          PY

      - name: Build Context and Library summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# GoEdge 1.3.9 Plus Context / Library ABI 审计'
            echo
            echo '- ZIP / edge-node MD5：PASS'
            echo '- 原版 edge-node 未执行，只做 GoReSym / objdump / ELF 数据读取。'
            echo
            echo '## 固定断言'
            cat audit/output/assertions.txt
            echo
            echo '## 原版十个 Library 注册 itab'
            cat audit/output/library-itabs.txt
            echo
            echo '## Context +0x48 直接引用'
            cat audit/output/context-offset-48-refs.txt
            echo
            echo '## 相关 JS namespace / bootstrap 字符串'
            sed -n '1,260p' audit/output/library-strings.txt
            echo
            echo '## 目标函数'
            cat audit/output/targets.txt
          } > audit/output/summary.md
          cat audit/output/summary.md

      - name: Upload Context and Library ABI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-context-library-abi-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
