name: Phase A Scripts Static Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-scripts-static-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4

      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover candidate script and event symbols
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          audit/tools/goresym -d "${BIN}" > audit/functions.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('audit/functions.json').read_text())
          funcs = list(data.get('UserFunctions') or []) + list(data.get('StdFunctions') or [])

          # 先使用高信号词，避免 runtime/os 的通用 event/exec 噪声淹没结果。
          strong = re.compile(r'(script|userscript|eventscript|hook|webhook|runcommand|commandrunner|shellcommand)', re.I)
          broad = re.compile(r'(event|command|exec|shell)', re.I)
          project = re.compile(r'(TeaOSLab|EdgeNode|internal/|pkg/)', re.I)

          strong_hits = []
          broad_hits = []
          for fn in funcs:
              name = fn.get('FullName') or ''
              blob = json.dumps(fn, ensure_ascii=False)
              if strong.search(blob):
                  strong_hits.append((name, blob))
              elif broad.search(blob) and project.search(blob):
                  broad_hits.append((name, blob))

          def compact(rows, limit=400):
              out = []
              for name, blob in rows[:limit]:
                  # 保留函数名，并从 GoReSym 元数据中提取可能的源文件路径。
                  paths = sorted(set(re.findall(r'[^"\\\s]+\.go', blob)))
                  out.append(name)
                  for path in paths[:8]:
                      out.append(f'  source: {path}')
              return '\n'.join(out) + ('\n' if out else '')

          Path('audit/output/candidate-functions-strong.txt').write_text(compact(strong_hits))
          Path('audit/output/candidate-functions-broad.txt').write_text(compact(broad_hits))
          Path('audit/output/function-counts.txt').write_text(
              f'strong={len(strong_hits)}\nbroad_project={len(broad_hits)}\n'
          )
          PY

          # Go 符号里可能没有完整源路径，再从只读字符串表补抓高信号路径/标识符。
          strings -a "${BIN}" | grep -Eai \
            '(/|^)(script|scripts|userscript|user_script|eventscript|event_script|hooks?)(/|\.go|$)|TeaOSLab/Edge(Node|Common).*(script|hook)|\b(UserScript|EventScript|RunCommand|ShellCommand)\b' \
            | sort -u | head -n 1000 > audit/output/candidate-strings-strong.txt || true

          strings -a "${BIN}" | grep -Eai \
            'TeaOSLab/Edge(Node|Common).*(event|command|exec|shell)|internal/[^ ]*(event|command|exec|shell)[^ ]*\.go' \
            | sort -u | head -n 1000 > audit/output/candidate-strings-broad.txt || true

          rm -f audit/functions.json

      - name: Build compact audit summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# GoEdge 1.3.9 Plus 脚本 / 事件脚本静态盘点'
            echo
            echo '- ZIP MD5: d6b495249683d981dea15b5bad97acdb (PASS)'
            echo '- edge-node MD5: 8ebac47c212dbb41cc0b2b9c6d4b32e4 (PASS)'
            echo '- 原版 edge-node 未执行。'
            echo
            echo '## 候选计数'
            cat audit/output/function-counts.txt
            echo
            echo '## 高信号函数候选'
            sed -n '1,240p' audit/output/candidate-functions-strong.txt
            echo
            echo '## 高信号字符串 / 源路径候选'
            sed -n '1,300p' audit/output/candidate-strings-strong.txt
            echo
            echo '## 项目域内宽松函数候选（截断）'
            sed -n '1,160p' audit/output/candidate-functions-broad.txt
            echo
            echo '## 项目域内宽松字符串候选（截断）'
            sed -n '1,200p' audit/output/candidate-strings-broad.txt
          } > audit/output/summary.md

          echo '=== Phase A scripts static audit summary ==='
          cat audit/output/summary.md

      - name: Upload compact scripts audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-static-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
