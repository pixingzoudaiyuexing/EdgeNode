name: Phase A Scripts Runtime Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-scripts-runtime-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-scripts-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4

      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover focused script runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"

          # 仅读取 Go build info；不会执行目标二进制。
          go version -m "${BIN}" > audit/output/module-info.txt 2>&1 || true
          strings -a "${BIN}" | grep -Eai \
            'http_request_events_script_plus\.go|/scripts/js/|goja|otto|tengo|gopher-lua|gopherlua|javascript|ecmascript|HTTPRequestScriptsConfig|ScriptGroupConfig|ScriptConfig' \
            | sort -u > audit/output/high-signal-strings.txt || true

          audit/tools/goresym -d "${BIN}" > audit/functions.json

          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          binary = Path('audit/output/binary-path.txt').read_text().strip()
          data = json.loads(Path('audit/functions.json').read_text())
          funcs = list(data.get('UserFunctions') or []) + list(data.get('StdFunctions') or [])

          def num(v):
              if isinstance(v, str):
                  return int(v, 0)
              return int(v or 0)

          rows = []
          by_start = {}
          for fn in funcs:
              name = fn.get('FullName') or ''
              start, end = num(fn.get('Start', 0)), num(fn.get('End', 0))
              if start and end > start:
                  rows.append((start, end, name, fn))
                  by_start[start] = name
          rows.sort()

          # 不要求 onInit/onRequest 必须保留独立符号。原版可能内联或折叠这些小钩子。
          needles = (
              '(*HTTPRequest).onInit',
              '(*HTTPRequest).onRequest',
              '(*HTTPRequest).Do',
              '(*HTTPRequest).doBegin',
          )
          targets = {}
          for start, end, name, fn in rows:
              for needle in needles:
                  if name.endswith(needle):
                      targets[needle] = (start, end, name)

          Path('audit/output/target-ranges.txt').write_text(''.join(
              f'{needle}\t0x{start:x}\t0x{end:x}\t{name}\n'
              for needle, (start, end, name) in targets.items()
          ))
          Path('audit/output/missing-targets.txt').write_text(''.join(
              needle + '\n' for needle in needles if needle not in targets
          ))

          config_re = re.compile(r'(HTTPRequestScriptsConfig|ScriptGroupConfig|ScriptConfig)', re.I)
          engine_re = re.compile(r'(goja|otto|tengo|gopher-lua|gopherlua|javascript|ecmascript|scriptengine|scripts/js)', re.I)
          path_re = re.compile(r'http_request_events_script_plus\.go|/scripts/js/|/scripts?/', re.I)

          config_symbols = []
          engine_symbols = []
          source_hits = []
          near_hook_names = []
          for start, end, name, fn in rows:
              blob = json.dumps(fn, ensure_ascii=False)
              if config_re.search(blob):
                  config_symbols.append((start, end, name))
              if engine_re.search(blob):
                  engine_symbols.append((start, end, name))
              if path_re.search(blob):
                  source_hits.append((start, end, name, blob))
              if re.search(r'(onInit|onRequest|HTTPRequest.*(script|event)|script.*HTTPRequest)', name, re.I):
                  near_hook_names.append((start, end, name))

          Path('audit/output/script-config-symbols.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n' for s,e,n in config_symbols
          ))
          Path('audit/output/engine-symbols.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n' for s,e,n in engine_symbols[:1600]
          ))
          Path('audit/output/near-hook-symbols.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n' for s,e,n in near_hook_names
          ))
          Path('audit/output/source-path-hits.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n{blob}\n\n' for s,e,n,blob in source_hits[:400]
          ))

          call_re = re.compile(r'\bcall\s+(?:0x)?([0-9a-f]+)', re.I)

          def disassemble(start, end, label):
              asm = subprocess.check_output([
                  'objdump','-d','-M','intel',f'--start-address=0x{start:x}',f'--stop-address=0x{end:x}',binary
              ], text=True, errors='replace')
              Path(f'audit/output/{label}-objdump.txt').write_text(asm)
              mapped = []
              for line in asm.splitlines():
                  m = call_re.search(line)
                  if not m:
                      continue
                  addr = int(m.group(1), 16)
                  mapped.append((addr, by_start.get(addr, '<unknown>'), line.strip()))
              Path(f'audit/output/{label}-calls.txt').write_text(''.join(
                  f'0x{addr:x}\t{name}\t{line}\n' for addr,name,line in mapped
              ))
              return mapped

          target_calls = {}
          for needle, (start, end, name) in targets.items():
              label = needle.replace('(*HTTPRequest).','').replace('*','').replace('(','').replace(')','')
              target_calls[needle] = disassemble(start, end, label)

          # 如果独立 onInit/onRequest 符号消失，则 Do/doBegin 的完整调用序列仍可用于按公开源码顺序定位内联/折叠实现。
          # 同时对所有 HTTPRequest 方法构建反向调用信息。
          interesting = {s:n for s,e,n in config_symbols + engine_symbols + near_hook_names}
          for needle, (s,e,n) in targets.items():
              interesting[s] = n

          reverse = []
          http_methods = [(s,e,n) for s,e,n,fn in rows if 'EdgeNode/internal/nodes.(*HTTPRequest).' in n]
          Path('audit/output/http-request-methods.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n' for s,e,n in http_methods
          ))
          for start, end, name in http_methods:
              try:
                  asm = subprocess.check_output([
                      'objdump','-d','-M','intel',f'--start-address=0x{start:x}',f'--stop-address=0x{end:x}',binary
                  ], text=True, errors='replace')
              except subprocess.CalledProcessError:
                  continue
              for line in asm.splitlines():
                  m = call_re.search(line)
                  if not m:
                      continue
                  addr = int(m.group(1), 16)
                  if addr in interesting:
                      reverse.append((name, addr, interesting[addr], line.strip()))
          Path('audit/output/reverse-callers.txt').write_text(''.join(
              f'{caller}\t=> 0x{addr:x}\t{callee}\t{line}\n'
              for caller,addr,callee,line in reverse
          ))

          # 单独列出 EdgeNode 非 HTTPRequest 的脚本/JS 高信号函数，帮助识别解释器包装层。
          project_script = []
          for start,end,name,fn in rows:
              blob = json.dumps(fn, ensure_ascii=False)
              if 'TeaOSLab/EdgeNode' in blob and re.search(r'(script|javascript|/js/)', blob, re.I):
                  project_script.append((start,end,name,blob))
          Path('audit/output/edge-node-script-symbols.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n' for s,e,n,blob in project_script[:1200]
          ))
          Path('audit/output/edge-node-script-metadata.txt').write_text(''.join(
              blob + '\n' for s,e,n,blob in project_script[:250]
          ))
          PY

      - name: Build focused runtime audit summary
        if: always()
        shell: bash
        run: |
          set -u
          {
            echo '# GoEdge 1.3.9 Plus 脚本请求链精确静态审计'
            echo
            echo '- ZIP MD5: d6b495249683d981dea15b5bad97acdb (PASS)'
            echo '- edge-node MD5: 8ebac47c212dbb41cc0b2b9c6d4b32e4 (PASS)'
            echo '- 原版 edge-node 未执行。'
            echo
            echo '## Go module/build info'
            sed -n '1,260p' audit/output/module-info.txt 2>/dev/null || true
            echo
            echo '## 高信号原始字符串'
            sed -n '1,260p' audit/output/high-signal-strings.txt 2>/dev/null || true
            echo
            echo '## 已保留关键符号'
            cat audit/output/target-ranges.txt 2>/dev/null || true
            echo
            echo '## 未保留为独立函数的目标'
            cat audit/output/missing-targets.txt 2>/dev/null || true
            echo
            echo '## 近似钩子符号'
            cat audit/output/near-hook-symbols.txt 2>/dev/null || true
            echo
            echo '## Do 直接调用序列'
            sed -n '1,360p' audit/output/Do-calls.txt 2>/dev/null || true
            echo
            echo '## doBegin 直接调用序列'
            sed -n '1,360p' audit/output/doBegin-calls.txt 2>/dev/null || true
            echo
            echo '## 脚本配置符号'
            cat audit/output/script-config-symbols.txt 2>/dev/null || true
            echo
            echo '## 解释器候选符号'
            sed -n '1,320p' audit/output/engine-symbols.txt 2>/dev/null || true
            echo
            echo '## EdgeNode 脚本高信号符号'
            sed -n '1,360p' audit/output/edge-node-script-symbols.txt 2>/dev/null || true
            echo
            echo '## 源路径元数据命中'
            sed -n '1,260p' audit/output/source-path-hits.txt 2>/dev/null || true
            echo
            echo '## 反向调用者'
            sed -n '1,320p' audit/output/reverse-callers.txt 2>/dev/null || true
          } > audit/output/summary.md
          cat audit/output/summary.md

      - name: Upload focused scripts runtime audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-runtime-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
