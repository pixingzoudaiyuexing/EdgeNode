name: Phase A Scripts Runtime Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-scripts-runtime-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-scripts-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4

      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .

      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover focused script runtime symbols
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          audit/tools/goresym -d "${BIN}" > audit/functions.json

          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          data = json.loads(Path('audit/functions.json').read_text())
          funcs = list(data.get('UserFunctions') or []) + list(data.get('StdFunctions') or [])

          def num(v):
              if isinstance(v, str):
                  return int(v, 0)
              return int(v or 0)

          rows = []
          by_start = {}
          for fn in funcs:
              name = fn.get('FullName') or ''
              start, end = num(fn.get('Start', 0)), num(fn.get('End', 0))
              if start and end > start:
                  rows.append((start, end, name, fn))
                  by_start[start] = name
          rows.sort()

          exact_suffixes = (
              '(*HTTPRequest).onInit',
              '(*HTTPRequest).onRequest',
              '(*HTTPRequest).Do',
              '(*HTTPRequest).doBegin',
          )
          targets = {}
          for start, end, name, fn in rows:
              for suffix in exact_suffixes:
                  if name.endswith(suffix):
                      targets[suffix] = (start, end, name)

          missing = [s for s in ('(*HTTPRequest).onInit', '(*HTTPRequest).onRequest') if s not in targets]
          if missing:
              raise SystemExit('可信 1.3.9 Plus 中未找到关键脚本钩子: ' + ', '.join(missing))

          Path('audit/output/target-ranges.txt').write_text(''.join(
              f'{suffix}\t0x{start:x}\t0x{end:x}\t{name}\n'
              for suffix, (start, end, name) in targets.items()
          ))

          # 枚举高度相关的配置与可能脚本引擎符号，但不依靠名字猜运行时行为。
          config_re = re.compile(r'(HTTPRequestScriptsConfig|ScriptGroupConfig|ScriptConfig)', re.I)
          engine_re = re.compile(r'(goja|otto|tengo|gopher-lua|yuin/gopher|javascript|ecmascript|scriptengine|script/runtime)', re.I)
          config_symbols = []
          engine_symbols = []
          for start, end, name, fn in rows:
              if config_re.search(name):
                  config_symbols.append((start, end, name))
              if engine_re.search(name):
                  engine_symbols.append((start, end, name))
          Path('audit/output/script-config-symbols.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n' for s,e,n in config_symbols
          ))
          Path('audit/output/engine-symbols.txt').write_text(''.join(
              f'0x{s:x}\t0x{e:x}\t{n}\n' for s,e,n in engine_symbols[:1000]
          ))

          # 对关键钩子和 Do/doBegin 单独反汇编，并映射直接调用。
          call_re = re.compile(r'\bcall\s+(?:0x)?([0-9a-f]+)', re.I)
          target_addrs = {v[0]: v[2] for v in targets.values()}
          config_addrs = {s:n for s,e,n in config_symbols}
          interesting_addrs = dict(target_addrs)
          interesting_addrs.update(config_addrs)

          direct_calls = []
          for suffix, (start, end, name) in targets.items():
              safe = suffix.replace('(*HTTPRequest).', '').replace('*','').replace('(','').replace(')','')
              asm = subprocess.check_output([
                  'objdump','-d','-M','intel',f'--start-address=0x{start:x}',f'--stop-address=0x{end:x}',
                  Path('audit/output/binary-path.txt').read_text().strip()
              ], text=True, errors='replace')
              Path(f'audit/output/{safe}-objdump.txt').write_text(asm)
              mapped = []
              for line in asm.splitlines():
                  m = call_re.search(line)
                  if not m:
                      continue
                  addr = int(m.group(1), 16)
                  callee = by_start.get(addr, '<unknown>')
                  mapped.append(f'0x{addr:x}\t{callee}\t{line.strip()}\n')
                  direct_calls.append((name, addr, callee, line.strip()))
              Path(f'audit/output/{safe}-calls.txt').write_text(''.join(mapped))

          # 只反汇编 EdgeNode internal/nodes 的 HTTPRequest 方法，做反向调用图，避免全二进制噪声。
          http_funcs = [(s,e,n) for s,e,n,fn in rows if 'EdgeNode/internal/nodes.(*HTTPRequest).' in n]
          reverse = []
          all_http_calls = []
          for start, end, name in http_funcs:
              try:
                  asm = subprocess.check_output([
                      'objdump','-d','-M','intel',f'--start-address=0x{start:x}',f'--stop-address=0x{end:x}',
                      Path('audit/output/binary-path.txt').read_text().strip()
                  ], text=True, errors='replace')
              except subprocess.CalledProcessError:
                  continue
              for line in asm.splitlines():
                  m = call_re.search(line)
                  if not m:
                      continue
                  addr = int(m.group(1), 16)
                  callee = by_start.get(addr, '<unknown>')
                  all_http_calls.append((name, addr, callee))
                  if addr in interesting_addrs:
                      reverse.append((name, addr, interesting_addrs[addr], line.strip()))

          Path('audit/output/reverse-callers.txt').write_text(''.join(
              f'{caller}\t=> 0x{addr:x}\t{callee}\t{line}\n'
              for caller,addr,callee,line in reverse
          ))

          # 从 onInit/onRequest 的直接被调函数继续展开一层，帮助识别实际执行器/解释器。
          first_level = {addr for caller,addr,callee,line in direct_calls if caller.endswith('onInit') or caller.endswith('onRequest')}
          second = []
          ranges_by_start = {s:(s,e,n) for s,e,n,fn in rows}
          for addr in sorted(first_level):
              row = ranges_by_start.get(addr)
              if row is None:
                  continue
              start,end,name = row
              try:
                  asm = subprocess.check_output([
                      'objdump','-d','-M','intel',f'--start-address=0x{start:x}',f'--stop-address=0x{end:x}',
                      Path('audit/output/binary-path.txt').read_text().strip()
                  ], text=True, errors='replace')
              except subprocess.CalledProcessError:
                  continue
              for line in asm.splitlines():
                  m = call_re.search(line)
                  if not m:
                      continue
                  callee_addr = int(m.group(1),16)
                  second.append((name,callee_addr,by_start.get(callee_addr,'<unknown>'),line.strip()))
          Path('audit/output/hook-second-level-calls.txt').write_text(''.join(
              f'{caller}\t=> 0x{addr:x}\t{callee}\t{line}\n'
              for caller,addr,callee,line in second
          ))

          # 高信号源路径/符号名，辅助确认 script build-tag 对应文件和依赖包。
          high = []
          for start,end,name,fn in rows:
              blob = json.dumps(fn, ensure_ascii=False)
              if ('HTTPRequest).onInit' in name or 'HTTPRequest).onRequest' in name or
                  config_re.search(blob) or engine_re.search(blob)):
                  paths = sorted(set(re.findall(r'[^"\\\s]+\.go', blob)))
                  high.append(name + '\n' + ''.join(f'  source: {p}\n' for p in paths[:12]))
          Path('audit/output/high-signal-metadata.txt').write_text(''.join(high))
          PY

      - name: Build focused runtime audit summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# GoEdge 1.3.9 Plus 脚本请求链精确静态审计'
            echo
            echo '- ZIP MD5: d6b495249683d981dea15b5bad97acdb (PASS)'
            echo '- edge-node MD5: 8ebac47c212dbb41cc0b2b9c6d4b32e4 (PASS)'
            echo '- 原版 edge-node 未执行。'
            echo
            echo '## 关键函数范围'
            cat audit/output/target-ranges.txt
            echo
            echo '## onInit 直接调用'
            cat audit/output/onInit-calls.txt
            echo
            echo '## onRequest 直接调用'
            cat audit/output/onRequest-calls.txt
            echo
            echo '## Do 对关键钩子的调用关系'
            grep -E 'onInit|onRequest|Script(Config|Group|s)' audit/output/Do-calls.txt || true
            echo
            echo '## HTTPRequest 内反向调用者'
            cat audit/output/reverse-callers.txt
            echo
            echo '## 钩子下一层调用'
            sed -n '1,320p' audit/output/hook-second-level-calls.txt
            echo
            echo '## 脚本配置符号'
            cat audit/output/script-config-symbols.txt
            echo
            echo '## 可能解释器符号（仅候选，不据此猜行为）'
            sed -n '1,240p' audit/output/engine-symbols.txt
            echo
            echo '## 高信号元数据 / 源路径'
            sed -n '1,320p' audit/output/high-signal-metadata.txt
          } > audit/output/summary.md

          echo '=== Phase A focused scripts runtime audit ==='
          cat audit/output/summary.md

      - name: Upload focused scripts runtime audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-runtime-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
