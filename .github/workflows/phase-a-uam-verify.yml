name: Phase A UAM Verify

on:
  push:
    branches:
      - master
    paths:
      - "internal/uam/**"
      - "internal/nodes/http_request_uam*.go"
      - ".github/workflows/phase-a-uam-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-uam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4
        with:
          path: EdgeNode

      - name: Checkout EdgeCommon
        uses: actions/checkout@v4
        with:
          repository: pixingzoudaiyuexing/EdgeCommon
          ref: main
          path: EdgeCommon

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: EdgeNode/go.sum

      - name: UAM unit tests
        working-directory: EdgeNode
        run: go test ./internal/uam

      - name: Compile nodes package with plus tag
        working-directory: EdgeNode
        run: go test -run '^$' -tags plus ./internal/nodes
