name: Phase A UAM Verify

on:
  push:
    branches:
      - master
    paths:
      - "internal/uam/**"
      - "internal/nodes/http_request_uam*.go"
      - ".github/workflows/phase-a-uam-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-uam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4
        with:
          path: EdgeNode

      - name: Checkout EdgeCommon
        uses: actions/checkout@v4
        with:
          repository: pixingzoudaiyuexing/EdgeCommon
          ref: main
          path: EdgeCommon

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: EdgeNode/go.sum

      - name: UAM unit tests
        working-directory: EdgeNode
        run: go test ./internal/uam

      - name: Prepare CI-only shims for unrelated Plus gaps
        working-directory: EdgeNode
        run: |
          # 这些文件只存在于 Actions 工作目录，不提交到产品源码。
          # 目的仅是绕过尚未重建、且与本轮 UAM 无关的旧 Plus 空桩，
          # 让编译器继续检查 UAM 请求链接线本身。
          sed 's#//go:build !plus#//go:build plus#' \
            internal/utils/minifiers/minify.go \
            > internal/utils/minifiers/minify_ci_plus.go
          sed 's#//go:build !plus#//go:build plus#' \
            internal/nodes/http_request_cc.go \
            > internal/nodes/http_request_cc_ci_plus.go

          # EdgeCommon 的 OSSConfig 在公开源码中已有 !plus 空实现；
          # CI 中只复制为 plus 版本，避免把尚未恢复的 OSS 私有实现混入 UAM 工作。
          sed 's#//go:build !plus#//go:build plus#; s#// +build !plus#// +build plus#' \
            ../EdgeCommon/pkg/serverconfigs/ossconfigs/oss_config.go \
            > ../EdgeCommon/pkg/serverconfigs/ossconfigs/oss_config_ci_plus.go

          # HTTPAuthPolicy.Init() 的公开实现被 !plus 标签排除；CI 只复制同一实现。
          sed 's#//go:build !plus#//go:build plus#' \
            ../EdgeCommon/pkg/serverconfigs/http_auth_policy_init.go \
            > ../EdgeCommon/pkg/serverconfigs/http_auth_policy_init_ci_plus.go

          # HTTPAuthType 文件在当前恢复仓库中缺失。这里按同代公开 EdgeCommon
          # 的原始定义补最小类型，仅用于让编译器继续走到 UAM 请求链。
          cat > ../EdgeCommon/pkg/serverconfigs/http_auth_type_ci_plus.go <<'EOF'
          //go:build plus

          package serverconfigs

          type HTTPAuthType = string

          const (
              HTTPAuthTypeBasicAuth  HTTPAuthType = "basicAuth"
              HTTPAuthTypeSubRequest HTTPAuthType = "subRequest"
          )
          EOF

          # TOAConfig 同样属于当前恢复仓库的历史 Plus 缺口。公开同代 EdgeCommon
          # 可确认其公开字段只有 IsOn，并提供 NewTOAConfig/Init/RandLocalPort。
          # 下列实现只用于编译隔离，不代表本轮恢复 TOA 的实际运行语义。
          cat > ../EdgeCommon/pkg/nodeconfigs/toa_config_ci_plus.go <<'EOF'
          //go:build plus

          package nodeconfigs

          type TOAConfig struct {
              IsOn bool `yaml:"isOn" json:"isOn"`
          }

          func NewTOAConfig() *TOAConfig {
              return &TOAConfig{}
          }

          func (this *TOAConfig) Init() error {
              return nil
          }

          func (this *TOAConfig) RandLocalPort() uint16 {
              return 0
          }
          EOF

          gofmt -w \
            internal/utils/minifiers/minify_ci_plus.go \
            internal/nodes/http_request_cc_ci_plus.go \
            ../EdgeCommon/pkg/serverconfigs/ossconfigs/oss_config_ci_plus.go \
            ../EdgeCommon/pkg/serverconfigs/http_auth_policy_init_ci_plus.go \
            ../EdgeCommon/pkg/serverconfigs/http_auth_type_ci_plus.go \
            ../EdgeCommon/pkg/nodeconfigs/toa_config_ci_plus.go

      - name: Type-check UAM request chain with plus tag
        working-directory: EdgeNode
        run: go test -run '^$' -tags plus ./internal/nodes
