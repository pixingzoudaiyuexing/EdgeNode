name: Phase A Scripts Bootstrap Context Audit

on:
  push:
    branches:
      - phase-a-scripts-core
    paths:
      - ".github/workflows/phase-a-scripts-bootstrap-context-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-bootstrap-context:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Recover bootstrap root and callback declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path=Path('audit/output/binary-path.txt').read_text().strip()
          data=Path(path).read_bytes()
          anchor=b'gojs.prepareNamespace = function (ns) {'
          start=data.find(anchor)
          if start < 0:
              raise SystemExit('prepareNamespace anchor missing')
          lo=max(0,start-2048)
          hi=min(len(data),start+4096)
          region=data[lo:hi]

          checks=[]
          # 只恢复声明形态，不保存整段私有 JS 源码。
          patterns={
              'gojs_empty_object': rb'(?:var|let|const)?\s*gojs\s*=\s*\{\s*\}',
              'callbacks_empty_array': rb'(?:var|let|const)\s+callbacks\s*=\s*\[\s*\]',
          }
          for name,pat in patterns.items():
              matches=list(re.finditer(pat,region,re.S))
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected exactly one nearby declaration, got {len(matches)}')
              m=matches[0]
              text=m.group(0).decode('utf-8')
              checks.append(f'{name}=PASS\toffset=0x{lo+m.start():x}\tdeclaration={text!r}\n')

          # 声明必须位于 prepareNamespace 之前；否则不能作为 bootstrap 初始化依据。
          for line in checks:
              off=int(re.search(r'offset=0x([0-9a-f]+)',line).group(1),16)
              if off >= start:
                  raise SystemExit('bootstrap declaration appears after prepareNamespace')

          Path('audit/output/summary.txt').write_text(''.join(checks))
          print(''.join(checks),end='')
          PY

      - name: Upload declaration evidence
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-bootstrap-context-audit
          path: audit/output/summary.txt
          if-no-files-found: error
          retention-days: 7
