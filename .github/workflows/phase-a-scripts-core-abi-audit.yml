name: Phase A Scripts Core ABI Audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase-a-scripts-core-abi-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-js-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EdgeNode
        uses: actions/checkout@v4
      - name: Checkout pinned GoReSym
        uses: actions/checkout@v4
        with:
          repository: mandiant/GoReSym
          ref: 6fba10d77df98335cbd1fb7839043d1ffde8defb
          path: audit/GoReSym
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Build pinned GoReSym
        working-directory: audit/GoReSym
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6fba10d77df98335cbd1fb7839043d1ffde8defb"
          mkdir -p ../tools
          go build -trimpath -o ../tools/goresym .
      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt
      - name: Recover JS core lifecycle ABI
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          audit/tools/goresym -d "${BIN}" > audit/functions.json
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          binary=Path('audit/output/binary-path.txt').read_text().strip()
          data=json.loads(Path('audit/functions.json').read_text())
          funcs=list(data.get('UserFunctions') or [])+list(data.get('StdFunctions') or [])
          def n(v): return int(v,0) if isinstance(v,str) else int(v or 0)
          rows=[]; by={}
          for f in funcs:
              name=f.get('FullName') or ''; s=n(f.get('Start')); e=n(f.get('End'))
              if s and e>s: rows.append((s,e,name,f)); by[s]=name
          rows.sort()
          wanted=(
            'internal/js.NewContext','internal/js.(*Context).init','internal/js.(*Context).Done',
            'internal/js.(*Context).Cleanup','internal/js.(*Context).Close',
            'internal/js.(*ContextPool).Get','internal/js.(*ContextPool).Put','internal/js.(*ContextPool).Close',
            'internal/js.NewIsolateWithContexts','internal/js.(*Isolate).init','internal/js.(*Isolate).OverUses',
            'internal/js.(*Isolate).GetContext','internal/js.(*Isolate).PutContext','internal/js.(*Isolate).Dispose',
            'internal/js.(*Isolate).createContext','internal/js.NewIsolatePool','internal/js.NewAutoIsolatePool',
            'internal/js.(*IsolatePool).init','internal/js.(*IsolatePool).tick',
            'internal/js.(*IsolatePool).GetContext','internal/js.(*IsolatePool).PutContext',
          )
          targets=[]
          for s,e,name,f in rows:
              if any(name.endswith(x) for x in wanted): targets.append((s,e,name,f))
          Path('audit/output/core-targets.txt').write_text(''.join(f'0x{s:x}\t0x{e:x}\t{name}\n' for s,e,name,f in targets))
          call_re=re.compile(r'\bcall\s+(?:0x)?([0-9a-f]+)',re.I)
          for s,e,name,f in targets:
              asm=subprocess.check_output(['objdump','-d','-M','intel',f'--start-address=0x{s:x}',f'--stop-address=0x{e:x}',binary],text=True,errors='replace')
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',name)[-150:]
              Path(f'audit/output/{safe}.asm.txt').write_text(asm)
              calls=[]
              for line in asm.splitlines():
                  m=call_re.search(line)
                  if m:
                      a=int(m.group(1),16); calls.append(f'0x{a:x}\t{by.get(a,"<unknown>")}\t{line.strip()}\n')
              Path(f'audit/output/{safe}.calls.txt').write_text(''.join(calls))
          # GoReSym JSON 中递归提取包含目标类型名的元数据，优先恢复字段布局。
          type_names=('internal/js.Context','internal/js.ContextPool','internal/js.Isolate','internal/js.IsolatePool')
          hits=[]
          def walk(x,path='$'):
              if isinstance(x,dict):
                  blob=json.dumps(x,ensure_ascii=False)
                  if any(t in blob for t in type_names) and any(k.lower() in ('types','type','fields','field','name','typename') for k in x):
                      if len(blob)<30000: hits.append((path,blob))
                  for k,v in x.items(): walk(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+f'[{i}]')
          walk(data)
          seen=set(); out=[]
          for path,blob in hits:
              if blob in seen: continue
              seen.add(blob); out.append(path+'\n'+blob+'\n\n')
          Path('audit/output/core-type-metadata.txt').write_text(''.join(out[:300]))
          PY
      - name: Build core ABI summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# GoEdge 1.3.9 Plus internal/js 核心生命周期审计'
            echo
            echo '- 只做静态分析；原版 edge-node 未执行。'
            echo
            echo '## 核心函数'
            cat audit/output/core-targets.txt
            echo
            echo '## Context / Pool / Isolate 类型元数据'
            sed -n '1,900p' audit/output/core-type-metadata.txt
            echo
            echo '## 关键直接调用'
            for f in audit/output/*.calls.txt; do
              echo "### $(basename "$f")"
              cat "$f"
            done
          } > audit/output/summary.md
          cat audit/output/summary.md
      - name: Upload JS core ABI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-core-abi-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
