name: Phase A CC GET302 Constants Audit

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/phase-a-cc-get302-constants-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-constants:
    runs-on: ubuntu-latest
    steps:
      - name: Download trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 3 --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Read exact GET302 constants from ELF
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat audit/output/binary-path.txt)"
          readelf -W -l "${BIN}" > audit/program-headers.txt
          python3 - <<'PY'
          from pathlib import Path

          addresses = {
              0x30b62af: 32,  # RedirectsChecking 默认 validatePath
              0x30afe47: 32,  # GET302 保留路径前缀 1
              0x3098db8: 32,  # GET302 保留路径前缀 2
              0x30b3935: 40,  # 临时放行/连续跳转计数 key 前缀
              0x30a275d: 32,  # 连续跳转计数 key 后缀
              0x30c03fd: 64,  # 连续跳转封禁 reason 前缀
              0x30bb36a: 64,  # 连续跳转封禁 reason 中段
              0x3090b08: 24,  # 连续跳转封禁 reason 尾段
              0x3095da4: 32,
              0x3095daa: 32,
              0x3093ca9: 32,
              0x3095db0: 32,
              0x3091a8c: 32,
              0x309c144: 32,
          }

          binary_path = Path('audit/output/binary-path.txt').read_text().strip()
          binary = Path(binary_path).read_bytes()
          segments = []
          for line in Path('audit/program-headers.txt').read_text(errors='replace').splitlines():
              parts = line.split()
              if parts and parts[0] == 'LOAD' and len(parts) >= 6:
                  off = int(parts[1], 16)
                  va = int(parts[2], 16)
                  filesz = int(parts[4], 16)
                  segments.append((va, va + filesz, off))

          out = []
          for addr, length in addresses.items():
              file_off = None
              for va0, va1, off0 in segments:
                  if va0 <= addr < va1:
                      file_off = off0 + (addr - va0)
                      break
              if file_off is None:
                  out.append(f'0x{addr:x}\t<unmapped>\n')
                  continue
              raw = binary[file_off:file_off+length]
              text = raw.decode('utf-8', errors='replace').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t')
              printable = ''.join(chr(b) if 32 <= b < 127 else '.' for b in raw)
              out.append(f'0x{addr:x}\tHEX={raw.hex()}\tASCII={printable}\tUTF8={text}\n')
          Path('audit/output/constants.txt').write_text(''.join(out))
          PY

      - name: Upload constants audit
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-cc-get302-constants
          path: audit/output/constants.txt
          retention-days: 7
