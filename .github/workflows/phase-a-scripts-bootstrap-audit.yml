name: Phase A Scripts Bootstrap Audit

on:
  push:
    branches:
      - phase-a-scripts-core
    paths:
      - ".github/workflows/phase-a-scripts-bootstrap-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Extract bounded bootstrap functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, struct
          from pathlib import Path

          path=Path('audit/output/binary-path.txt').read_text().strip()
          data=Path(path).read_bytes()
          if data[:4] != b'\x7fELF' or data[4] != 2 or data[5] != 1:
              raise SystemExit('unexpected ELF')
          e_phoff=struct.unpack_from('<Q',data,32)[0]
          e_phentsize=struct.unpack_from('<H',data,54)[0]
          e_phnum=struct.unpack_from('<H',data,56)[0]
          loads=[]
          for i in range(e_phnum):
              o=e_phoff+i*e_phentsize
              typ,flags=struct.unpack_from('<II',data,o)
              if typ != 1: continue
              po,pv,pp,pfs,pms,pa=struct.unpack_from('<QQQQQQ',data,o+8)
              loads.append((pv,pv+pfs,po))
          def file_off(addr):
              for lo,hi,off in loads:
                  if lo <= addr < hi:
                      return off+(addr-lo), hi-addr
              raise SystemExit(f'address 0x{addr:x} not file-backed')
          def cstr(addr,limit=4096):
              off,avail=file_off(addr)
              end=min(len(data),off+min(limit,avail))
              nul=data.find(b'\x00',off,end)
              if nul < 0:
                  raise SystemExit(f'no NUL for 0x{addr:x}')
              return data[off:nul]

          funcs={
              'prepareNamespace':0x2d2b300,
              'copyAttrs':0x2d2b431,
              'once':0x2d2b547,
              'runOnce':0x2d2b5a2,
          }
          summary=[]
          for name,addr in funcs.items():
              raw=cstr(addr)
              text=raw.decode('utf-8')
              Path(f'audit/output/{name}.js.txt').write_text(text+'\n')
              summary.append(f'{name}\tlen={len(raw)}\tsha256={hashlib.sha256(raw).hexdigest()}\n')
          Path('audit/output/summary.txt').write_text(''.join(summary))
          print(''.join(summary),end='')
          PY

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-bootstrap-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
