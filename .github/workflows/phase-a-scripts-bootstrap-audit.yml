name: Phase A Scripts Bootstrap Audit

on:
  push:
    branches:
      - phase-a-scripts-core
    paths:
      - ".github/workflows/phase-a-scripts-bootstrap-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify trusted 1.3.9 Plus archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/output
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 \
            'https://dl.naixi.net/cdn/goedge/goedgecn/edge-node-linux-amd64-plus-v1.3.9.zip' \
            -o audit/input/edge-node-linux-amd64-plus-v1.3.9.zip
          echo 'd6b495249683d981dea15b5bad97acdb  audit/input/edge-node-linux-amd64-plus-v1.3.9.zip' | md5sum -c -
          unzip -q audit/input/edge-node-linux-amd64-plus-v1.3.9.zip -d audit/extracted
          BIN="$(find audit/extracted -type f -name edge-node -perm /111 -print -quit)"
          test -n "${BIN}"
          echo "8ebac47c212dbb41cc0b2b9c6d4b32e4  ${BIN}" | md5sum -c -
          echo "${BIN}" > audit/output/binary-path.txt

      - name: Extract bounded bootstrap functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          path=Path('audit/output/binary-path.txt').read_text().strip()
          data=Path(path).read_bytes()

          prefixes={
              'prepareNamespace':b'gojs.prepareNamespace = function (ns) {',
              'copyAttrs':b'gojs.copyAttrs = function (destObj, srcObj) {',
              'once':b'gojs.once = function (f) {',
              'runOnce':b'gojs.runOnce = function () {',
          }

          def extract_function(prefix):
              start=data.find(prefix)
              if start < 0:
                  raise SystemExit('prefix not found: '+prefix.decode())
              end=min(len(data),start+8192)
              brace=data.find(b'{',start,end)
              if brace < 0:
                  raise SystemExit('opening brace not found')
              depth=0
              quote=None
              escape=False
              line_comment=False
              block_comment=False
              i=brace
              while i < end:
                  c=data[i]
                  n=data[i+1] if i+1 < end else None
                  if line_comment:
                      if c == 0x0a: line_comment=False
                      i+=1; continue
                  if block_comment:
                      if c == ord('*') and n == ord('/'):
                          block_comment=False; i+=2; continue
                      i+=1; continue
                  if quote is not None:
                      if escape: escape=False
                      elif c == ord('\\'): escape=True
                      elif c == quote: quote=None
                      i+=1; continue
                  if c in (ord('"'),ord("'")):
                      quote=c; i+=1; continue
                  if c == ord('/') and n == ord('/'):
                      line_comment=True; i+=2; continue
                  if c == ord('/') and n == ord('*'):
                      block_comment=True; i+=2; continue
                  if c == ord('{'): depth+=1
                  elif c == ord('}'):
                      depth-=1
                      if depth == 0:
                          raw=data[start:i+1]
                          return start,raw.decode('utf-8',errors='strict')
                  i+=1
              raise SystemExit('function closing brace not found in bounded window')

          summary=[]
          for name,prefix in prefixes.items():
              off,text=extract_function(prefix)
              raw=text.encode('utf-8')
              Path(f'audit/output/{name}.js.txt').write_text(text+'\n')
              summary.append(f'{name}\toffset=0x{off:x}\tlen={len(raw)}\tsha256={hashlib.sha256(raw).hexdigest()}\n')
          Path('audit/output/summary.txt').write_text(''.join(summary))
          print(''.join(summary),end='')
          PY

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: goedge-139-plus-scripts-bootstrap-audit
          path: audit/output/
          if-no-files-found: error
          retention-days: 7
