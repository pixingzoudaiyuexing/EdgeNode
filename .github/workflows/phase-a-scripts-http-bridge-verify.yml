name: Phase A Scripts HTTP Bridge Verify

on:
  push:
    branches:
      - phase-a-scripts-http-bridge
    paths:
      - "internal/js/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/phase-a-scripts-http-bridge-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-http-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout EdgeCommon
        uses: actions/checkout@v4
        with:
          repository: pixingzoudaiyuexing/EdgeCommon
          ref: main
          path: EdgeCommon

      - name: Checkout EdgeNode
        uses: actions/checkout@v4
        with:
          path: EdgeNode

      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: EdgeNode/go.sum

      - name: Verify V8 dependency lock
        working-directory: EdgeNode
        shell: bash
        run: |
          set -euo pipefail
          go mod download rogchap.com/v8go@v0.8.0
          git diff --exit-code -- go.mod go.sum

      - name: Test Scripts-2 bridge package
        working-directory: EdgeNode
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags script ./internal/js
